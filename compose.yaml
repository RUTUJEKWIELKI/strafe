services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strafe}
      POSTGRES_USER: ${POSTGRES_USER:-strafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strafe}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-strafe} -d ${POSTGRES_DB:-strafe}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    expose:
      - '5432'
    volumes:
      - strafe-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
    expose:
      - '6379'
    volumes:
      - strafe-redis:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-strafe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-strafe-development-secret}
    expose:
      - '9000'
      - '9001'
    volumes:
      - strafe-minio:/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-strafe-development-search-key}
    expose:
      - '7700'
    volumes:
      - strafe-meilisearch:/meili_data

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    expose:
      - '3310'
    volumes:
      - strafe-clamav:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    expose:
      - '1025'
      - '8025'

volumes:
  strafe-postgres:
  strafe-redis:
  strafe-minio:
  strafe-meilisearch:
  strafe-clamav:
