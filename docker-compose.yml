version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: strafe
      POSTGRES_PASSWORD: strafe_password
      POSTGRES_DB: strafe
    ports:
      - '5432:5432'
    volumes:
      - strafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strafe -d strafe']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - strafe_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      MEILI_MASTER_KEY: strafe_search_master_key
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - strafe_meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: always
    environment:
      MINIO_ROOT_USER: strafe_s3_admin
      MINIO_ROOT_PASSWORD: strafe_s3_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - strafe_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    restart: always
    ports:
      - '3310:3310'

volumes:
  strafe_pgdata:
  strafe_redisdata:
  strafe_meilidata:
  strafe_miniodata:
