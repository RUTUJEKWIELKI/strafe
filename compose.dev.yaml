services:
  # The API is normally run on the host with `pnpm api:dev`.
  # Keep these bindings loopback-only and opt-in with:
  # docker compose -f compose.yaml -f compose.dev.yaml up -d
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  meilisearch:
    ports:
      - '127.0.0.1:7700:7700'

  clamav:
    ports:
      - '127.0.0.1:3310:3310'

  mailpit:
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
