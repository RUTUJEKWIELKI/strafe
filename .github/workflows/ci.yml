name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm check

      - name: Verify generated API client
        run: |
          pnpm contracts:generate
          git diff --exit-code -- apps/api/openapi apps/web/src/lib/api/schema.d.ts

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: strafe
          POSTGRES_PASSWORD: strafe
          POSTGRES_USER: strafe
        options: >-
          --health-cmd "pg_isready -U strafe -d strafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://strafe:strafe@localhost:5432/strafe

      - name: Exercise community API
        run: pnpm --filter @strafe/api test:integration
        env:
          AUTH_JWT_SECRET: ci-integration-secret-with-at-least-32-characters
          DATABASE_URL: postgresql://strafe:strafe@localhost:5432/strafe
          TEST_DATABASE_URL: postgresql://strafe:strafe@localhost:5432/strafe
